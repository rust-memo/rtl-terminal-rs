<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2712%27 fill=%27%230d1117%27/%3E%3Ctext x=%2732%27 y=%2744%27 font-size=%2732%27 text-anchor=%27middle%27 fill=%27%233fb950%27 font-family=%27monospace%27%3E%C2%AB_%3C/text%3E%3C/svg%27">
<title>RTL Terminal — طرفية تدعم العربية</title>
<link rel="stylesheet" href="vendor/xterm.css">
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d;
    --fg: #e6edf3; --muted: #8b949e; --accent: #238636;
    --link: #58a6ff; --danger: #f85149; --ok: #3fb950;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Segoe UI', Tahoma, Arial, sans-serif; background: var(--bg); color: var(--fg); }
  header { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 8px; }
  header h1 { font-size: 18px; margin: 0; display: flex; align-items: center; gap: 8px; }
  header h1 .badge { background: var(--accent); color: #fff; font-size: 11px; padding: 2px 8px; border-radius: 12px; letter-spacing: 1px; }
  header h1 small { color: var(--muted); font-weight: normal; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button { background: var(--accent); color: #fff; border: none; padding: 7px 14px; border-radius: 6px; cursor: pointer; font-size: 14px; }
  button.ghost { background: #21262d; border: 1px solid var(--border); }
  button:hover { opacity: .9; }
  .toggle { display: flex; align-items: center; gap: 6px; background: #21262d; border: 1px solid var(--border); padding: 6px 12px; border-radius: 6px; font-size: 14px; cursor: pointer; }
  .toggle input { accent-color: var(--accent); width: 16px; height: 16px; cursor: pointer; }
  main { display: grid; grid-template-rows: 1fr auto; gap: 10px; padding: 12px; height: calc(100vh - 120px); }
  #term-wrap { background: #000; border: 1px solid var(--border); border-radius: 8px; padding: 8px; overflow: hidden; }
  #term-wrap.rtl-mode .xterm-screen { direction: rtl; text-align: right; }
  #term { width: 100%; height: 100%; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; display: flex; gap: 8px; align-items: center; }
  #cmd { flex: 1; background: var(--bg); border: 1px solid var(--border); color: var(--fg); border-radius: 6px; padding: 10px 12px; font-size: 15px; font-family: inherit; outline: none; }
  #cmd:focus { border-color: var(--accent); }
  #cmd[dir="rtl"] { text-align: right; }
  #cmd[dir="ltr"] { text-align: left; }
  #status { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  #status .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--danger); }
  #status.on .dot { background: var(--ok); }
  #mode-badge { font-size: 11px; padding: 2px 8px; border-radius: 12px; background: #21262d; border: 1px solid var(--border); color: var(--muted); }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 8px; }
  kbd { background: #21262d; border: 1px solid var(--border); border-radius: 4px; padding: 1px 6px; font-size: 11px; }
  @media (max-width: 720px) { main { height: auto; } }
</style>
</head>
<body>
<header>
  <h1><span style="color: var(--ok);">█▓</span> RTL Terminal <span class="badge">RUST</span> <small>طرفية احترافية تدعم العربية</small></h1>
  <div class="controls">
    <span id="status"><span class="dot"></span><span id="status-t">غير متصل</span></span>
    <span id="mode-badge">جارٍ الاتصال…</span>
    <label class="toggle"><input type="checkbox" id="rtl-toggle" checked> RTL</label>
    <label class="toggle"><input type="checkbox" id="shape-toggle" checked> تشكيل</label>
    <button class="ghost" id="dir-btn">⇄</button>
    <button class="ghost" id="clear-btn">مسح</button>
  </div>
</header>
<main>
  <div id="term-wrap"><div id="term"></div></div>
  <div class="panel">
    <input id="cmd" dir="auto" placeholder="اكتب أمراً… مثال: echo مرحبا بالعالم 123" autocomplete="off" spellcheck="false">
    <button id="send-btn">إرسال ⏎</button>
  </div>
</main>
<footer>RTL-Terminal-RS v2.0 — Rust (Tauri v2) + xterm.js • MIT • <kbd>Ctrl+L</kbd> مسح</footer>

<script src="vendor/xterm.js"></script>
<script src="vendor/addon-fit.js"></script>
<script src="rtl-bidi.js"></script>
<script src="app.js"></script>
</body>
</html>
