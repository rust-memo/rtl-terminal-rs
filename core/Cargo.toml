[package]
name = "rtl-terminal-core"
version = "2.0.0"
license = "MIT"
authors = ["rust-memo"]
description = "Core RTL/BiDi + Arabic shaping + PTY for RTL-Terminal"
edition = "2024"

[features]
pty = ["portable-pty"]  # enable PTY shell sessions

[dependencies]
portable-pty = { version = "0.8", optional = true }